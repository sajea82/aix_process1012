<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate - 로그인 및 회원가입</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* 지정해주신 메인 컬러 팔레트 연동 */
            --bg-cream: #f7f3e8;
            --cream-dark: #eee9d8;
            --palette-deep: #1f06ac;
            --palette-mid: #0f42c0;
            --palette-light: #5882e8;
            --palette-yellow: #e3ef4f;
            --dark-text: #121629;
            
            --subtle-border: rgba(31, 6, 172, 0.15);
            --card-bg: #ffffff;
            --border-radius-lg: 28px;
            --border-radius-md: 18px;
            --transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-cream);
            color: var(--dark-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-cream);
            border-bottom: 1px solid var(--subtle-border);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--palette-deep);
            color: #fff;
            padding: 0.65rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .back-btn:hover {
            background-color: var(--palette-mid);
            color: #ffffff;
            transform: translateX(-4px);
        }

        .brand-logo {
            font-family: 'Fredoka', cursive;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--palette-deep);
            text-decoration: none;
        }

        /* Auth Main Card Container */
        .auth-container {
            max-width: 500px;
            width: 100%;
            margin: 3.5rem auto 5rem auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--subtle-border);
            border-radius: var(--border-radius-lg);
            box-shadow: 0 12px 32px rgba(31, 6, 172, 0.08);
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Hero Image Banner */
        .hero-banner {
            position: relative;
            height: 170px;
            width: 100%;
            border-bottom: 1px solid var(--subtle-border);
            overflow: hidden;
        }

        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(31,6,172,0.2) 0%, rgba(31,6,172,0.75) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            color: #ffffff;
        }

        .hero-overlay h1 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .hero-overlay p {
            font-size: 0.88rem;
            opacity: 0.9;
            margin-top: 0.2rem;
        }

        .auth-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        /* Switch Tabs */
        .tab-switcher {
            display: flex;
            background-color: var(--bg-cream);
            padding: 0.35rem;
            border-radius: 50px;
            border: 1px solid var(--subtle-border);
            gap: 0.3rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.65rem 0;
            border: none;
            border-radius: 50px;
            font-size: 0.92rem;
            font-weight: 800;
            color: #666;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn.active {
            background-color: var(--palette-deep);
            color: var(--palette-yellow);
            box-shadow: 0 2px 8px rgba(31,6,172,0.25);
        }

        /* Input Form Group */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--palette-deep);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.1rem;
            color: var(--palette-light);
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            border-radius: 14px;
            border: 1px solid var(--subtle-border);
            background-color: var(--bg-cream);
            font-size: 0.93rem;
            font-weight: 600;
            color: var(--dark-text);
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: var(--palette-deep);
            box-shadow: 0 0 0 3px rgba(31, 6, 172, 0.15);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 0.95rem;
            border-radius: 50px;
            border: 1px solid var(--subtle-border);
            background-color: var(--palette-yellow);
            color: var(--palette-deep);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(31, 6, 172, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }

        .submit-btn:hover {
            background-color: var(--palette-deep);
            color: var(--palette-yellow);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(31, 6, 172, 0.2);
        }

        /* Callout */
        .register-callout {
            background-color: var(--bg-cream);
            border: 1px dashed var(--subtle-border);
            border-radius: var(--border-radius-md);
            padding: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        .register-callout p {
            font-size: 0.85rem;
            font-weight: 700;
            color: #555;
        }

        .register-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: var(--palette-deep);
            color: var(--palette-yellow);
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .register-link-btn:hover {
            background-color: var(--palette-mid);
            color: #ffffff;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #888;
            font-size: 0.78rem;
            font-weight: 700;
            margin: 0.2rem 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--subtle-border);
        }

        .divider span {
            padding: 0 0.8rem;
        }

        .social-login-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.7rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1px solid var(--subtle-border);
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .social-btn.kakao { background-color: #fee500; color: #191919; }
        .social-btn.naver { background-color: #03c75a; color: #fff; }
        .social-btn.google { background-color: #ffffff; color: var(--dark-text); }

        footer {
            text-align: center;
            padding: 2.2rem;
            background-color: var(--palette-deep);
            color: #ffffff;
            font-size: 0.88rem;
            margin-top: auto;
        }

        .hidden-form { display: none !important; }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> 홈으로 이동
        </a>
        <a href="#" class="brand-logo">TravelMate</a>
        <span style="width: 100px;"></span>
    </header>

    <!-- Main Container -->
    <main class="auth-container">
        
        <div class="auth-card">
            
            <div class="hero-banner">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Travel Banner">
                <div class="hero-overlay">
                    <h1>나만의 여행 취향 찾기</h1>
                    <p>TravelMate와 함께 빅데이터 기반 맞춤 여행지를 시작해보세요.</p>
                </div>
            </div>

            <div class="auth-body">

                <div class="tab-switcher">
                    <button id="loginTab" class="tab-btn active" onclick="showForm('login')">로그인</button>
                    <button id="registerTab" class="tab-btn" onclick="showForm('register')">회원가입</button>
                </div>

                <!-- FORM A: 로그인 -->
                <form id="loginForm" onsubmit="handleAuth(event, 'login')">
                    <div style="display: flex; flex-direction: column; gap: 1.1rem;">
                        <div class="form-group">
                            <label for="loginId"><i class="fa-solid fa-user"></i> 아이디 (이메일)</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" id="loginId" class="form-input" placeholder="example@travelmate.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="loginPw"><i class="fa-solid fa-lock"></i> 비밀번호</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-key"></i>
                                <input type="password" id="loginPw" class="form-input" placeholder="비밀번호를 입력하세요" required>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">
                            로그인하기 <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </form>

                <!-- FORM B: 회원가입 -->
                <form id="registerForm" class="hidden-form" onsubmit="handleAuth(event, 'register')">
                    <div style="display: flex; flex-direction: column; gap: 1.1rem;">
                        <div class="form-group">
                            <label for="regName"><i class="fa-solid fa-id-card"></i> 이름</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-user-tag"></i>
                                <input type="text" id="regName" class="form-input" placeholder="홍길동" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="regEmail"><i class="fa-solid fa-envelope"></i> 이메일 아이디</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-at"></i>
                                <input type="email" id="regEmail" class="form-input" placeholder="example@travelmate.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="regPw"><i class="fa-solid fa-lock"></i> 비밀번호</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-key"></i>
                                <input type="password" id="regPw" class="form-input" placeholder="8자리 이상 입력" required>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" style="background-color: var(--palette-deep); color: var(--palette-yellow);">
                            무료 회원가입 <i class="fa-solid fa-user-plus"></i>
                        </button>
                    </div>
                </form>

                <div id="registerCallout" class="register-callout">
                    <p>아직 TravelMate 회원이 아니신가요?</p>
                    <button type="button" class="register-link-btn" onclick="showForm('register')">
                        1초 만에 회원가입하기 <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="divider">
                    <span>간편 로그인</span>
                </div>

                <div class="social-login-grid">
                    <a href="#" class="social-btn kakao">
                        <i class="fa-solid fa-comment"></i> 카카오
                    </a>
                    <a href="#" class="social-btn naver">
                        <i class="fa-solid fa-N"></i> 네이버
                    </a>
                    <a href="#" class="social-btn google">
                        <i class="fa-brands fa-google"></i> Google
                    </a>
                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 TravelMate. All rights reserved.</p>
    </footer>

    <script>
        function showForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const registerCallout = document.getElementById('registerCallout');

            if (type === 'login') {
                loginForm.classList.remove('hidden-form');
                registerForm.classList.add('hidden-form');
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                registerCallout.style.display = 'flex';
            } else {
                loginForm.classList.add('hidden-form');
                registerForm.classList.remove('hidden-form');
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                registerCallout.style.display = 'none';
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            if (type === 'login') {
                alert("성공적으로 로그인되었습니다! 메인 페이지로 이동합니다.");
                window.location.href = "index.html";
            } else {
                alert("회원가입이 완료되었습니다! 로그인해 주세요.");
                showForm('login');
            }
        }
    </script>
</body>
</html>
