{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>처음 만나는 AI 융복합 시각 학습북</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: "Jua", "Gaegu", "Pretendard", "Malgun Gothic", sans-serif;
      color: #23311d;
      overflow-x: hidden;
    }

    /* 화면 전체를 빈틈없이 채우는 초록 잔디·꽃밭 무대 */
    .meadow-stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      border-radius: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 250, 205, 0.75), transparent 34%),
        linear-gradient(180deg, #8fd35c 0%, #76c446 58%, #5cb032 100%);
      box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.45);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      animation: cardPop 0.65s cubic-bezier(0.22, 1.25, 0.36, 1) both;
    }

    @keyframes cardPop {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 아래쪽 덤불 느낌 장식 */
    .bush-left,
    .bush-right {
      position: absolute;
      bottom: -46px;
      width: 280px;
      height: 130px;
      border-radius: 999px;
      background: #3d8c22;
      pointer-events: none;
    }

    .bush-left {
      left: -40px;
      box-shadow: 110px 15px 0 -10px #4aa12b;
    }

    .bush-right {
      right: -30px;
      box-shadow: -110px 18px 0 -8px #4aa12b;
    }

    /* 살랑이는 작은 꽃 장식 */
    .flower {
      position: absolute;
      font-size: 1.45rem;
      user-select: none;
      pointer-events: none;
      animation: sway 3.4s ease-in-out infinite alternate;
    }

    .f1 { top: 14%; left: 28%; animation-delay: 0s; }
    .f2 { top: 22%; right: 24%; font-size: 1.2rem; animation-delay: -0.7s; }
    .f3 { bottom: 20%; left: 22%; font-size: 1.3rem; animation-delay: -1.3s; }
    .f4 { bottom: 24%; right: 26%; animation-delay: -1.9s; }
    .f5 { top: 46%; left: 15%; font-size: 1.1rem; animation-delay: -2.4s; }

    @keyframes sway {
      0% { transform: rotate(-6deg) translateY(0px); }
      100% { transform: rotate(7deg) translateY(-5px); }
    }

    /* 둥글둥글 귀여운 마스코트/풍선 친구들 */
    .buddy {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      pointer-events: none;
      z-index: 2;
    }

    .buddy-left {
      top: 44px;
      left: 48px;
      animation: bounceBuddy 2.8s ease-in-out infinite;
    }

    .buddy-right {
      bottom: 48px;
      right: 54px;
      animation: bounceBuddy 3.1s ease-in-out infinite reverse;
    }

    .buddy-balloon {
      top: 44px;
      right: 60px;
      animation: floatBalloon 3.6s ease-in-out infinite;
    }

    @keyframes bounceBuddy {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-9px) rotate(2deg); }
    }

    @keyframes floatBalloon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-11px); }
    }

    .mascot-circle {
      width: 116px;
      height: 116px;
      border-radius: 46% 54% 48% 52% / 52% 45% 55% 48%;
      background: #ffe066;
      border: 4px solid #fff9db;
      box-shadow: 0 8px 0 #e6a82e, 0 14px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .mascot-circle.mint {
      width: 100px;
      height: 100px;
      background: #e8f8ff;
      border-color: #ffffff;
      box-shadow: 0 7px 0 #9ad0ec, 0 12px 20px rgba(0, 0, 0, 0.1);
    }

    .cheek {
      position: absolute;
      top: 58px;
      width: 14px;
      height: 8px;
      border-radius: 999px;
      background: #ff8fa3;
      opacity: 0.75;
    }
    .cheek.l { left: 23px; }
    .cheek.r { right: 23px; }

    .eyes {
      font-size: 1.35rem;
      line-height: 1;
      font-weight: 800;
      color: #2b261d;
      margin-bottom: 4px;
    }

    .mouth {
      width: 16px;
      height: 9px;
      border-bottom: 3.5px solid #2b261d;
      border-radius: 0 0 16px 16px;
    }

    .balloon-badge {
      padding: 10px 18px;
      border-radius: 999px;
      background: #ff9f43;
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      border: 3px solid #fff8eb;
      box-shadow: 0 6px 0 #d9771c;
    }

    .balloon-string {
      width: 2px;
      height: 36px;
      background: rgba(255, 255, 255, 0.85);
    }

    /* 가운데 메인 책표지 콘텐츠 */
    .cover-center {
      position: relative;
      z-index: 3;
      max-width: 720px;
      width: 100%;
      text-align: center;
      padding: 12px;
    }

    .badge-pill {
      display: inline-block;
      background: #fffdf5;
      color: #3d8c22;
      font-size: 0.98rem;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 999px;
      border: 2.5px solid #d9f2b4;
      box-shadow: 0 4px 0 rgba(61, 140, 34, 0.18);
      margin-bottom: 16px;
    }

    .cover-title {
      font-size: clamp(2.3rem, 5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.22;
      color: #fffdf7;
      text-shadow:
        0 4px 0 #3f8f22,
        0 9px 18px rgba(34, 77, 16, 0.28);
      margin-bottom: 18px;
      word-break: keep-all;
    }

    .cover-title .highlight {
      color: #ffe66d;
    }

    .cover-desc {
      font-size: clamp(1.02rem, 2vw, 1.2rem);
      line-height: 1.65;
      color: #f7ffe9;
      background: rgba(45, 98, 24, 0.28);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 15px 24px;
      margin: 0 auto 24px;
      max-width: 580px;
    }

    .photo-slot {
      width: 100%;
      max-width: 560px;
      margin: 0 auto 28px;
      padding: 18px 22px;
      border-radius: 22px;
      background: rgba(255, 253, 245, 0.92);
      border: 3px dashed #7bc943;
      box-shadow: 0 8px 0 rgba(61, 140, 34, 0.15);
    }

    .subject-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .subject-chips span {
      background: #eef9df;
      color: #2f6f18;
      border: 1.5px solid #b8e388;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .photo-note {
      font-size: 0.86rem;
      color: #5c7352;
    }

    .start-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 17px 36px;
      border-radius: 999px;
      background: #ff9f43;
      color: #ffffff;
      font-size: 1.18rem;
      font-weight: 800;
      text-decoration: none;
      border: 3px solid #fff9eb;
      box-shadow: 0 7px 0 #d67418, 0 14px 24px rgba(0, 0, 0, 0.16);
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .start-btn:hover {
      background: #ffa954;
      transform: translateY(-3px);
      box-shadow: 0 10px 0 #d67418, 0 18px 28px rgba(0, 0, 0, 0.2);
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #d67418, 0 6px 12px rgba(0, 0, 0, 0.14);
    }

    @media (max-width: 720px) {
      .meadow-stage {
        padding: 40px 18px 76px;
      }
      .buddy-left {
        top: 16px;
        left: 16px;
      }
      .mascot-circle {
        width: 74px;
        height: 74px;
      }
      .cheek {
        top: 38px;
        width: 10px;
        height: 6px;
      }
      .cheek.l { left: 13px; }
      .cheek.r { right: 13px; }
      .eyes { font-size: 1rem; }
      .buddy-balloon,
      .buddy-right,
      .flower {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="meadow-stage">
    <div class="flower f1">✿</div>
    <div class="flower f2">❀</div>
    <div class="flower f3">✿</div>
    <div class="flower f4">❀</div>
    <div class="flower f5">✿</div>

    <div class="buddy buddy-left" aria-hidden="true">
      <div class="mascot-circle">
        <span class="cheek l"></span>
        <span class="cheek r"></span>
        <div class="eyes">^ ^</div>
        <div class="mouth"></div>
      </div>
    </div>

    <div class="buddy buddy-balloon" aria-hidden="true">
      <div class="balloon-badge">같이 놀면서 배워요!</div>
      <div class="balloon-string"></div>
    </div>

    <div class="buddy buddy-right" aria-hidden="true">
      <div class="mascot-circle mint">
        <div class="eyes">• ◡ •</div>
        <div class="mouth"></div>
      </div>
    </div>

    <section class="cover-center" aria-label="책표지">
      <div class="badge-pill">부담 없이 시작하는 그림책 스타일 학습북</div>
      <h1 class="cover-title">
        처음 만나는 <span class="highlight">AI 융복합</span><br />
        시각 학습북
      </h1>
      <p class="cover-desc">
        딱딱한 코드 암기 대신, 귀여운 흐름과 직접 눌러보는 재미로
        파이썬·데이터·AI·웹이 이어지는 길을 함께 걸어봐요!
      </p>

      <div class="photo-slot">
        <div class="subject-chips">
          <span>Python</span>
          <span>pandas</span>
          <span>머신러닝·딥러닝</span>
          <span>HTML·JS</span>
          <span>융합 체험관</span>
        </div>
        <div class="photo-note">큰 표지 사진이나 그림을 넣을 자리 (지금은 가벼운 미리보기 영역)</div>
      </div>

      <a href="{% url 'home:index' %}" class="start-btn">
        <span>책 펼치기 / 학습 시작하기</span>
        <span aria-hidden="true">▶</span>
      </a>
    </section>

    <div class="bush-left"></div>
    <div class="bush-right"></div>
  </main>
</body>
</html>
