{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>처음 만나는 AI 융복합 시각 학습북</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: 'Jua', 'Malgun Gothic', sans-serif;
      background-color: #f6f4f0;
      color: #2c241e;
    }

    .cover-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .cover-card {
      position: relative;
      width: 100%;
      max-width: 720px;
      background-color: #fff9f2;
      background-image: radial-gradient(#f0d8b8 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      border: 3px solid #f5dfc1;
      border-radius: 32px;
      box-shadow: 0 14px 36px rgba(166, 94, 38, 0.14);
      padding: 56px 36px 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      overflow: hidden;
    }

    .cover-badge {
      display: inline-block;
      background-color: #ffefe0;
      color: #b85c24;
      border: 2px solid #f7c999;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 1.05rem;
    }

    .cat-box {
      width: 170px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-svg {
      width: 160px;
      height: 150px;
      filter: drop-shadow(0 10px 14px rgba(184, 83, 25, 0.18));
    }

    .cover-title {
      font-size: clamp(2.2rem, 5vw, 3.3rem);
      line-height: 1.25;
      color: #2b241f;
      font-weight: 400;
      word-break: keep-all;
    }

    .cover-title .highlight {
      color: #e67828;
    }

    .cover-sub {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.55;
      color: #695c52;
      max-width: 460px;
      word-break: keep-all;
    }

    .open-btn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 38px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f58c42 0%, #e47224 100%);
      color: #ffffff;
      font-size: 1.25rem;
      text-decoration: none;
      box-shadow: 0 6px 0 #ad4c10, 0 12px 22px rgba(173, 76, 16, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #ad4c10, 0 16px 26px rgba(173, 76, 16, 0.3);
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #ad4c10;
    }

    .paw-deco {
      position: absolute;
      right: 18px;
      bottom: 14px;
      opacity: 0.45;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="cover-wrap">
    <section class="cover-card" aria-label="책표지">
      <div class="cover-badge">작은 고양이와 함께 여는 첫 페이지</div>

      <div class="cat-box" aria-hidden="true">
        <svg class="cat-svg" viewBox="0 0 180 170" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M126 126C150 124 158 102 146 86C140 78 132 83 136 91C140 101 135 112 123 115"
                stroke="#f2994a" stroke-width="9" stroke-linecap="round"/>
          <ellipse cx="90" cy="124" rx="35" ry="30" fill="#ffb86c" stroke="#7c4a27" stroke-width="3"/>
          <ellipse cx="90" cy="128" rx="20" ry="19" fill="#fff7ea"/>
          <path d="M56 68L49 33L80 52Z" fill="#ffb86c" stroke="#7c4a27" stroke-width="3" stroke-linejoin="round"/>
          <path d="M124 68L131 33L100 52Z" fill="#ffb86c" stroke="#7c4a27" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="90" cy="78" rx="42" ry="35" fill="#ffc478" stroke="#7c4a27" stroke-width="3"/>
          <ellipse cx="64" cy="85" rx="7" ry="4.5" fill="#ff9aa2" opacity="0.75"/>
          <ellipse cx="116" cy="85" rx="7" ry="4.5" fill="#ff9aa2" opacity="0.75"/>
          <circle cx="73" cy="75" r="5" fill="#3b2f26"/>
          <circle cx="71.5" cy="73.5" r="1.6" fill="#ffffff"/>
          <circle cx="107" cy="75" r="5" fill="#3b2f26"/>
          <circle cx="105.5" cy="73.5" r="1.6" fill="#ffffff"/>
          <polygon points="86,82 94,82 90,87" fill="#ff7b7b"/>
          <path d="M83 90C85.5 94 89 93 90 88.5C91 93 94.5 94 97 90"
                stroke="#3b2f26" stroke-width="2.6" stroke-linecap="round"/>
          <polygon points="78,108 90,113 78,118" fill="#5fa8d3" stroke="#3b2f26" stroke-width="2"/>
          <polygon points="102,108 90,113 102,118" fill="#5fa8d3" stroke="#3b2f26" stroke-width="2"/>
          <circle cx="90" cy="113" r="4" fill="#ff8fa3" stroke="#3b2f26" stroke-width="2"/>
        </svg>
      </div>

      <h1 class="cover-title">
        처음 만나는 <span class="highlight">AI 융복합</span><br />
        시각 학습북
      </h1>

      <p class="cover-sub">
        복잡한 메뉴나 긴 설명 대신,<br />
        가벼운 책표지 한 장으로 시작해요.
      </p>

      <a href="{% url 'home:index' %}" class="open-btn">
        <span>책 펼치기</span>
        <span aria-hidden="true">→</span>
      </a>

      <svg class="paw-deco" width="44" height="44" viewBox="0 0 44 44" fill="#d9a473" aria-hidden="true">
        <ellipse cx="22" cy="28" rx="8" ry="6.5"/>
        <circle cx="12" cy="19" r="3.5"/>
        <circle cx="19" cy="15" r="3.5"/>
        <circle cx="26" cy="15" r="3.5"/>
        <circle cx="33" cy="19" r="3.5"/>
      </svg>
    </section>
  </main>
</body>
</html>
