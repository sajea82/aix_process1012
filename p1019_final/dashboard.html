<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권역별 관광지 분석 대시보드</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 20px; }
        
        /* 상단 지역 선택 버튼 */
        .region-selector { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .region-btn { padding: 12px 28px; font-size: 16px; font-weight: 700; border: 2px solid #cbd5e1; border-radius: 10px; background: white; color: #475569; cursor: pointer; transition: all 0.2s ease; }
        .region-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .region-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }

        /* 상단 레이아웃 (좌: 지도 이미지, 우: 통합 TOP10) */
        .top-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid #e2e8f0; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 지도 컨테이너 */
        .map-wrapper { width: 100%; height: 340px; background: #ffffff; border-radius: 10px; border: 1px solid #cbd5e1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .map-bg-img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .map-badge { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; z-index: 5; backdrop-filter: blur(4px); }

        /* 지도 위 순위 번호 마커 핀 */
        .map-pin { position: absolute; width: 30px; height: 30px; background: #ef4444; color: white; border: 2.5px solid #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; cursor: pointer; transform: translate(-50%, -50%); transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
        .map-pin:hover { transform: translate(-50%, -50%) scale(1.3); background: #2563eb; z-index: 20; }

        /* 통합 TOP 10 리스트 */
        .top10-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
        .top10-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #edf2f7; cursor: pointer; transition: background 0.2s; }
        .top10-item:hover { background: #eff6ff; border-color: #bfdbfe; }
        .top10-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #cbd5e1; flex-shrink: 0; }
        .top10-info { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top10-rank { font-weight: 800; color: #2563eb; margin-right: 6px; }

        /* 하단 연령대 브라우저 탭 */
        .tabs-container { border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; background: white; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); }
        .tab-bar { display: flex; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; padding: 6px 6px 0 6px; gap: 4px; }
        .tab-btn { padding: 12px 24px; font-size: 15px; font-weight: 700; border: none; background: transparent; color: #64748b; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .tab-btn:hover { color: #1e293b; background: rgba(255,255,255,0.5); }
        .tab-btn.active { background: white; color: #2563eb; border-bottom: 3px solid #2563eb; }

        .tab-content { padding: 24px; }
        .chart-box { height: 260px; margin-bottom: 24px; }

        /* 상위 5개 이미지 카드 */
        .top5-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
        .top5-card { background: #f8fafc; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; text-align: center; transition: transform 0.2s; cursor: pointer; }
        .top5-card:hover { transform: translateY(-3px); }
        .top5-card img { width: 100%; height: 115px; object-fit: cover; background: #e2e8f0; display: block; }
        .top5-card-title { padding: 10px 6px; font-size: 13px; font-weight: 700; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 팝업 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 380px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); text-align: center; position: relative; animation: modalUp 0.25s ease-out; }
        @keyframes modalUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-close { position: absolute; top: 14px; right: 18px; font-size: 22px; font-weight: bold; color: #94a3b8; cursor: pointer; }
        .modal-close:hover { color: #0f172a; }
        .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: #e2e8f0; }
        .modal-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .modal-badge { display: inline-block; padding: 4px 12px; background: #eff6ff; color: #2563eb; font-weight: 700; border-radius: 20px; font-size: 13px; margin-bottom: 12px; }
        .modal-desc { font-size: 14px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- 지역 선택 버튼 -->
    <div class="region-selector">
        <button class="region-btn active" onclick="switchRegion('cb')">충청북도</button>
        <button class="region-btn" onclick="switchRegion('cn')">충청남도</button>
        <button class="region-btn" onclick="switchRegion('jn')">전남광주통합특별시</button>
    </div>

    <!-- 상단 레이아웃: 지도 이미지 + 전체 TOP 10 -->
    <div class="top-container">
        <div class="card">
            <div class="card-title">
                <span>🗺️ 권역별 명소 지점</span>
                <span style="font-size: 12px; color: #64748b; font-weight: 400;">순위 번호 핀 클릭 시 상세 팝업</span>
            </div>
            <div class="map-wrapper" id="map-wrapper">

                <img id="map-img" class="map-bg-img" src="./images/cb_images/충청북도.jpg" alt="권역 지도" onerror="handleMapError(this)">
                <!-- 마커 핀 영역 -->
                <div id="pins-container"></div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">🏆 전체 통합 검색 순위 TOP 10</div>
            <div class="top10-list" id="top10-container"></div>
        </div>
    </div>

    <!-- 하단 레이아웃: 브라우저 탭 연령대별 차트 & 상위 5개 이미지 -->

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchAge('20대')">20대</button>
            <button class="tab-btn" onclick="switchAge('30대')">30대</button>
            <button class="tab-btn" onclick="switchAge('40대')">40대</button>
            <button class="tab-btn" onclick="switchAge('50대')">50대</button>
            <button class="tab-btn" onclick="switchAge('60대')">60대</button>
        </div>
        <div class="tab-content">
            <div class="chart-box">
                <canvas id="ageChart"></canvas>
            </div>
            <div class="card-title" style="font-size:15px; margin-bottom:12px; border-bottom:none;">📸 해당 연령대 TOP 5 명소</div>
            <div class="top5-cards" id="top5-container"></div>
        </div>
    </div>

    <!-- 상세정보 팝업 모달 -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <img id="modal-img" class="modal-img" src="" alt="명소 이미지" onerror="this.src='https://via.placeholder.com/380x200?text=Image+Not+Found';">
            <div id="modal-badge" class="modal-badge">TOP 명소</div>

            <div id="modal-desc" class="modal-desc">검색 비율 및 상세 설명</div>
        </div>
    </div>

        function switchRegion(regionKey) {

            const imgEl = document.getElementById('map-img');
            imgEl.src = data.mapImage;
            document.getElementById('map-label').innerText = data.name;

            renderDashboard();
        }

            img.src = 'https://via.placeholder.com/400x340?text=' + encodeURIComponent(regionData[currentRegion].name + ' 지도 없음');

        function switchAge(age) {
            currentAge = age;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderChartAndCards();
        }

        function renderDashboard() {
            renderMapPins();
            renderTop10();
            renderChartAndCards();
        }

        // 순위 번호 마커 핀 출력
        function renderMapPins() {
            const container = document.getElementById('pins-container');
            container.innerHTML = '';
            const data = regionData[currentRegion];

            data.top10.forEach((item) => {
                const pin = document.createElement('div');
                pin.className = 'map-pin';
                pin.style.left = `${item.x}%`;
                pin.style.top = `${item.y}%`;
                pin.innerText = item.rank; 
                pin.onclick = () => openModal(item.name, `${data.name} 검색 순위 ${item.rank}위 (비율: ${item.ratio})`, item.rank);
                container.appendChild(pin);
            });
        }

        function renderTop10() {
            const container = document.getElementById('top10-container');
            container.innerHTML = '';
            const data = regionData[currentRegion];

            data.top10.forEach((item) => {
                const imgUrl = `${data.imagesPath}${item.name}.jpg`;
                container.innerHTML += `
                    <div class="top10-item" onclick="openModal('${item.name}', '${data.name} 검색 순위 ${item.rank}위 (비율: ${item.ratio})', ${item.rank})">

                        <div class="top10-info">

                            <span>${item.name}</span>

            });
        }

        function renderChartAndCards() {
            const ageItems = regionData[currentRegion].ageData[currentAge];
            const labels = ageItems.map(item => item.name);
            const ratios = ageItems.map(item => item.ratio);

            const ctx = document.getElementById('ageChart').getContext('2d');
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${currentAge} 검색 비율 (%)`,
                        data: ratios,
                        backgroundColor: '#2563eb',
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            const top5Container = document.getElementById('top5-container');
            top5Container.innerHTML = '';

            ageItems.forEach((item, idx) => {
                const imgUrl = `${regionData[currentRegion].imagesPath}${item.name}.jpg`;
                top5Container.innerHTML += `
                    <div class="top5-card" onclick="openModal('${item.name}', '${currentAge} 인기 명소 ${idx+1}위 (비율: ${item.ratio}%)', ${idx+1})">
                        <img src="${imgUrl}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x115?text=Img';">
                        <div class="top5-card-title">${idx+1}위 | ${item.name}</div>
                    </div>
                `;
            });
        }

        function openModal(placeName, desc, rank) {
            const data = regionData[currentRegion];
            document.getElementById('modal-img').src = `${data.imagesPath}${placeName}.jpg`;
            document.getElementById('modal-title').innerText = placeName;
            document.getElementById('modal-badge').innerText = `TOP ${rank} 명소`;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>
</body>
</html>
