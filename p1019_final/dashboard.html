<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권역별 관광지 분석 대시보드</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 20px; }
        
        /* 상단 지역 선택 버튼 */
        .region-selector { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .region-btn { padding: 12px 28px; font-size: 16px; font-weight: 700; border: 2px solid #cbd5e1; border-radius: 10px; background: white; color: #475569; cursor: pointer; transition: all 0.2s ease; }
        .region-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .region-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }

        /* 상단 레이아웃 (좌: 지도, 우: 통합 TOP10) */
        .top-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid #e2e8f0; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 한국 지도 구역 시각화 */
        .map-wrapper { display: flex; align-items: center; justify-content: center; height: 310px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; position: relative; padding: 10px; }
        .map-badge { position: absolute; top: 12px; left: 12px; background: #0f172a; color: white; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; }

        /* 지도 SVG */
        svg.map-svg { width: 100%; height: 100%; max-height: 280px; }
        .map-zone { fill: #cbd5e1; stroke: #ffffff; stroke-width: 2; transition: all 0.3s ease; }
        .map-zone.active { fill: #2563eb; filter: drop-shadow(0px 4px 6px rgba(37, 99, 235, 0.4)); }
        .map-label { font-size: 11px; font-weight: 700; fill: #475569; pointer-events: none; }
        .map-label.active { fill: #ffffff; }

        /* 통합 TOP 10 리스트 */
        .top10-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 310px; overflow-y: auto; padding-right: 4px; }
        .top10-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #edf2f7; }
        .top10-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #cbd5e1; flex-shrink: 0; }
        .top10-info { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top10-rank { font-weight: 800; color: #2563eb; margin-right: 6px; }

        /* 하단 연령대 브라우저 탭 */
        .tabs-container { border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; background: white; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); }
        .tab-bar { display: flex; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; padding: 6px 6px 0 6px; gap: 4px; }
        .tab-btn { padding: 12px 24px; font-size: 15px; font-weight: 700; border: none; background: transparent; color: #64748b; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .tab-btn:hover { color: #1e293b; background: rgba(255,255,255,0.5); }
        .tab-btn.active { background: white; color: #2563eb; border-bottom: 3px solid #2563eb; }

        .tab-content { padding: 24px; }
        .chart-box { height: 260px; margin-bottom: 24px; }

        /* 상위 5개 이미지 카드 */
        .top5-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
        .top5-card { background: #f8fafc; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; text-align: center; transition: transform 0.2s; }
        .top5-card:hover { transform: translateY(-3px); }
        .top5-card img { width: 100%; height: 115px; object-fit: cover; background: #e2e8f0; display: block; }
        .top5-card-title { padding: 10px 6px; font-size: 13px; font-weight: 700; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <!-- 지역 선택 영역 -->
    <div class="region-selector">
        <button class="region-btn active" onclick="switchRegion('cb')">충청북도</button>
        <button class="region-btn" onclick="switchRegion('cn')">충청남도</button>
        <button class="region-btn" onclick="switchRegion('jn')">전남광주통합특별시</button>
    </div>

    <!-- 상단 레이아웃: 행정구역 지도 + 전체 TOP 10 -->
    <div class="top-container">
        <div class="card">
            <div class="card-title">
                <span>🗺️ 행정구역 위치</span>
                <span style="font-size: 12px; color: #64748b; font-weight: 400;">선택된 권역 하이라이트</span>
            </div>
            <div class="map-wrapper">
                <div class="map-badge" id="map-label">충청북도</div>
                <!-- 대한민국 간략 행정구역 벡터 지도 -->
                <svg class="map-svg" viewBox="0 0 200 260">
                    <!-- 기타 권역 (수도권/강원) -->
                    <path d="M 60 20 L 140 20 L 150 70 L 60 70 Z" class="map-zone" style="fill:#e2e8f0;" />
                    <text x="100" y="48" class="map-label" text-anchor="middle" style="fill:#94a3b8;">수도권/강원</text>

                    <!-- 충청남도 (CN) -->
                    <path id="zone-cn" d="M 30 75 L 95 75 L 85 135 L 20 120 Z" class="map-zone" />
                    <text x="58" y="105" id="label-cn" class="map-label" text-anchor="middle">충남</text>

                    <!-- 충청북도 (CB) -->
                    <path id="zone-cb" d="M 98 75 L 160 75 L 145 135 L 88 135 Z" class="map-zone active" />
                    <text x="122" y="105" id="label-cb" class="map-label active" text-anchor="middle">충북</text>

                    <!-- 기타 권역 (경상권) -->
                    <path d="M 148 138 L 180 138 L 170 230 L 118 230 Z" class="map-zone" style="fill:#e2e8f0;" />
                    <text x="150" y="185" class="map-label" text-anchor="middle" style="fill:#94a3b8;">경상권</text>

                    <!-- 전남광주통합특별시 (JN) -->
                    <path id="zone-jn" d="M 20 138 L 115 138 L 115 230 L 30 230 Z" class="map-zone" />
                    <text x="67" y="185" id="label-jn" class="map-label" text-anchor="middle">전남·광주</text>
                </svg>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">🏆 전체 통합 검색 순위 TOP 10</div>
            <div class="top10-list" id="top10-container"></div>
        </div>
    </div>

    <!-- 하단 레이아웃: 브라우저 탭 방식 연령대별 차트 & 상위 5개 이미지 -->
    <div class="tabs-container">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchAge('20대')">20대</button>
            <button class="tab-btn" onclick="switchAge('30대')">30대</button>
            <button class="tab-btn" onclick="switchAge('40대')">40대</button>
            <button class="tab-btn" onclick="switchAge('50대')">50대</button>
            <button class="tab-btn" onclick="switchAge('60대')">60대</button>
        </div>
        <div class="tab-content">
            <div class="chart-box">
                <canvas id="ageChart"></canvas>
            </div>
            <div class="card-title" style="font-size:15px; margin-bottom:12px; border-bottom:none;">📸 해당 연령대 TOP 5 명소</div>
            <div class="top5-cards" id="top5-container"></div>
        </div>
    </div>

    <script>
        // p1019_final 폴더 내부 위치 기준 상대경로 설정
        const regionData = {
            cb: {
                name: '충청북도',
                imagesPath: './images/cb_images/',
                top10: ['법주사', '만천하스카이워크', '청주오스코', '청주동물원', '오창호수공원', '진천농다리', '구인사', '의림지', '활옥동굴', '떼제베CC'],
                ageData: {
                    '20대': [
                        { name: '오창호수공원', ratio: 10.0 }, { name: 'CGV청주서문', ratio: 8.1 },
                        { name: '청주오스코', ratio: 5.7 }, { name: '대청댐전망대', ratio: 5.5 },
                        { name: 'CGV청주지웰시티', ratio: 4.3 }
                    ],
                    '30대': [
                        { name: '청주동물원', ratio: 7.8 }, { name: '청주오스코', ratio: 7.5 },
                        { name: '오창호수공원', ratio: 5.4 }, { name: '문암생태공원', ratio: 5.4 },
                        { name: '의림지', ratio: 5.3 }
                    ],
                    '40대': [
                        { name: '만천하스카이워크', ratio: 5.9 }, { name: '떼제베CC', ratio: 5.6 },
                        { name: '법주사', ratio: 5.4 }, { name: '활옥동굴', ratio: 4.9 },
                        { name: '청주오스코', ratio: 4.8 }
                    ],
                    '50대': [
                        { name: '법주사', ratio: 5.5 }, { name: '떼제베CC', ratio: 4.8 },
                        { name: '올데이CC', ratio: 4.6 }, { name: '만천하스카이워크', ratio: 4.0 },
                        { name: '대영힐스CC', ratio: 3.9 }
                    ],
                    '60대': [
                        { name: '법주사', ratio: 7.9 }, { name: '보은대추축제', ratio: 6.6 },
                        { name: '진천농다리', ratio: 5.5 }, { name: '만천하스카이워크', ratio: 4.9 },
                        { name: '구인사', ratio: 4.8 }
                    ]
                }
            },
            cn: {
                name: '충청남도',
                imagesPath: './images/cn_images/',
                top10: ['대천해수욕장', '삽교호관광지', '독립기념관', '해미읍성', '삼길포항', '남당항', '백제문화단지', '공산성', '상화원', '수덕사'],
                ageData: {
                    '20대': [
                        { name: '대천해수욕장', ratio: 13.8 }, { name: '삽교호관광지', ratio: 12.4 },
                        { name: '독립기념관', ratio: 5.7 }, { name: '신정호수공원', ratio: 4.6 },
                        { name: 'CGV천안펜타포트', ratio: 3.9 }
                    ],
                    '30대': [
                        { name: '삽교호관광지', ratio: 9.0 }, { name: '대천해수욕장', ratio: 8.0 },
                        { name: '독립기념관', ratio: 7.7 }, { name: '천안삼거리공원', ratio: 5.5 },
                        { name: '백제문화단지', ratio: 4.9 }
                    ],
                    '40대': [
                        { name: '독립기념관', ratio: 7.4 }, { name: '대천해수욕장', ratio: 6.9 },
                        { name: '백제문화단지', ratio: 6.6 }, { name: '삽교호관광지', ratio: 6.1 },
                        { name: '삼길포항', ratio: 4.3 }
                    ],
                    '50대': [
                        { name: '대천해수욕장', ratio: 6.7 }, { name: '삼길포항', ratio: 5.1 },
                        { name: '삽교호관광지', ratio: 4.8 }, { name: '독립기념관', ratio: 4.6 },
                        { name: '남당항', ratio: 4.3 }
                    ],
                    '60대': [
                        { name: '상화원', ratio: 6.1 }, { name: '대천해수욕장', ratio: 5.4 },
                        { name: '삼길포항', ratio: 5.1 }, { name: '마곡사', ratio: 5.0 },
                        { name: '수덕사', ratio: 5.0 }
                    ]
                }
            },
            jn: {
                name: '전남광주통합특별시',
                imagesPath: './images/jn_images/',
                top10: ['죽녹원', '국립아시아문화전당', '김대중컨벤션센터', '낙안읍성민속마을', '오동도', '향일암', '아쿠아플라넷여수', '화순고인돌가을꽃축제', '백양사', '화엄사'],
                ageData: {
                    '20대': [
                        { name: '국립아시아문화전당', ratio: 14.9 }, { name: '김대중컨벤션센터', ratio: 6.3 },
                        { name: '죽녹원', ratio: 4.6 }, { name: '아쿠아플라넷여수', ratio: 4.5 },
                        { name: '만성리검은모래해변', ratio: 3.8 }
                    ],
                    '30대': [
                        { name: '국립아시아문화전당', ratio: 10.5 }, { name: '죽녹원', ratio: 6.9 },
                        { name: '김대중컨벤션센터', ratio: 5.6 }, { name: '광주패밀리랜드', ratio: 4.8 },
                        { name: '아쿠아플라넷여수', ratio: 4.8 }
                    ],
                    '40대': [
                        { name: '죽녹원', ratio: 7.2 }, { name: '국립광주과학관', ratio: 6.5 },
                        { name: '국립아시아문화전당', ratio: 5.2 }, { name: '광주패밀리랜드', ratio: 4.8 },
                        { name: '낙안읍성민속마을', ratio: 4.7 }
                    ],
                    '50대': [
                        { name: '죽녹원', ratio: 7.3 }, { name: '향일암', ratio: 5.2 },
                        { name: '화엄사', ratio: 5.2 }, { name: '백양사', ratio: 4.5 },
                        { name: '낙안읍성민속마을', ratio: 4.4 }
                    ],
                    '60대': [
                        { name: '화순고인돌가을꽃축제', ratio: 7.3 }, { name: '죽녹원', ratio: 6.1 },
                        { name: '장성황룡강가을꽃축제', ratio: 5.9 }, { name: '백양사', ratio: 5.6 },
                        { name: '화엄사', ratio: 5.1 }
                    ]
                }
            }
        };

        let currentRegion = 'cb';
        let currentAge = '20대';
        let chart;

        window.onload = function() {
            renderDashboard();
        };

        function switchRegion(regionKey) {
            currentRegion = regionKey;
            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 지도 강조 표시 전환
            document.querySelectorAll('.map-zone').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.map-label').forEach(el => el.classList.remove('active'));
            
            const targetZone = document.getElementById(`zone-${regionKey}`);
            const targetLabel = document.getElementById(`label-${regionKey}`);
            if (targetZone) targetZone.classList.add('active');
            if (targetLabel) targetLabel.classList.add('active');

            document.getElementById('map-label').innerText = regionData[currentRegion].name;
            renderDashboard();
        }

        function switchAge(age) {
            currentAge = age;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderChartAndCards();
        }

        function renderDashboard() {
            renderTop10();
            renderChartAndCards();
        }

        function renderTop10() {
            const container = document.getElementById('top10-container');
            container.innerHTML = '';
            const data = regionData[currentRegion];

            data.top10.forEach((place, idx) => {
                const imgUrl = `${data.imagesPath}${place}.jpg`;
                container.innerHTML += `
                    <div class="top10-item">
                        <img class="top10-img" src="${imgUrl}" alt="${place}">
                        <div class="top10-info">
                            <span class="top10-rank">${idx+1}위</span>
                            <span>${place}</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderChartAndCards() {
            const ageItems = regionData[currentRegion].ageData[currentAge];
            const labels = ageItems.map(item => item.name);
            const ratios = ageItems.map(item => item.ratio);

            const ctx = document.getElementById('ageChart').getContext('2d');
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${currentAge} 검색 비율 (%)`,
                        data: ratios,
                        backgroundColor: '#2563eb',
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            const top5Container = document.getElementById('top5-container');
            top5Container.innerHTML = '';

            ageItems.forEach((item, idx) => {
                const imgUrl = `${regionData[currentRegion].imagesPath}${item.name}.jpg`;
                top5Container.innerHTML += `
                    <div class="top5-card">
                        <img src="${imgUrl}" alt="${item.name}">
                        <div class="top5-card-title">${idx+1}위 | ${item.name}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
