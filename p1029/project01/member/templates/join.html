{% extends 'base.html' %}

{% block title %}회원가입 - 여행메이트{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>회원가입</h2>

    {% if msg %}
    <p class="auth-msg">{{ msg }}</p>
    {% endif %}

    <form method="post" action="{% url 'member:join' %}" id="joinForm">
        {% csrf_token %}
        <div class="form-row">
            <label for="id">아이디</label>
            <input type="text" name="id" id="id" maxlength="30" required>
        </div>
        <div class="form-row">
            <label for="pw">비밀번호</label>
            <input type="password" name="pw" id="pw" required>
        </div>
        <div class="form-row">
            <label for="pw2">비밀번호 확인</label>
            <input type="password" id="pw2" required>
        </div>
        <div class="form-row">
            <label for="name">이름</label>
            <input type="text" name="name" id="name" required>
        </div>
        <div class="form-row">
            <label for="nickname">닉네임</label>
            <input type="text" name="nickname" id="nickname" required>
        </div>
        <div class="form-row">
            <label for="tel">전화번호</label>
            <input type="text" name="tel" id="tel" placeholder="010-1234-5678">
        </div>
        <div class="form-row">
            <label>성별</label>
            <div class="choice">
                <label><input type="radio" name="gender" value="남자" checked> 남자</label>
                <label><input type="radio" name="gender" value="여자"> 여자</label>
            </div>
        </div>
        <div class="form-row">
            <label>취미</label>
            <div class="choice">
                <label><input type="checkbox" name="hobby" value="게임"> 게임</label>
                <label><input type="checkbox" name="hobby" value="골프"> 골프</label>
                <label><input type="checkbox" name="hobby" value="수영"> 수영</label>
                <label><input type="checkbox" name="hobby" value="조깅"> 조깅</label>
                <label><input type="checkbox" name="hobby" value="독서"> 독서</label>
            </div>
        </div>
        <button type="submit" class="btn-main">가입하기</button>
    </form>

    <p class="auth-link">이미 회원이신가요? <a href="{% url 'member:login' %}">로그인</a></p>
</div>
{% endblock %}

{% block script %}
<script>
$(function(){
    // 보내기 전에 비밀번호 두 칸이 같은지 확인
    $('#joinForm').submit(function(){
        if ($('#pw').val() != $('#pw2').val()) {
            alert('비밀번호가 서로 다릅니다.');
            $('#pw2').focus();
            return false;              // 전송 막기
        }
    });
});
</script>
{% endblock %}
